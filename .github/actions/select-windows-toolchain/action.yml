name: Select bootstrapped Windows toolchain
description: Verify the bootstrapped Visual C++ toolchain and put its compiler first on PATH.

runs:
  using: composite
  steps:
    - name: Select bootstrapped Windows toolchain
      shell: pwsh
      run: |
        $stateDir = if ($env:MOZBUILD_STATE_PATH) {
          $env:MOZBUILD_STATE_PATH
        } else {
          Join-Path $env:USERPROFILE '.mozbuild'
        }
        $msvcRoot = Join-Path $stateDir 'vs\VC\Tools\MSVC'
        if (-not (Test-Path -LiteralPath $msvcRoot -PathType Container)) {
          throw "Bootstrapped Visual C++ tree not found at $msvcRoot"
        }

        $msvcPath = Get-ChildItem -LiteralPath $msvcRoot -Directory |
          Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
          Sort-Object { [version]$_.Name } |
          Select-Object -Last 1
        if (-not $msvcPath) {
          throw "No bootstrapped MSVC version found under $msvcRoot"
        }

        $vcBin = Join-Path $msvcPath.FullName 'bin\Hostx64\x64'
        $required = @(
          (Join-Path $vcBin 'cl.exe'),
          (Join-Path $msvcPath.FullName 'atlmfc\include\atlbase.h'),
          (Join-Path $msvcPath.FullName 'atlmfc\lib\x64\atls.lib')
        )
        foreach ($path in $required) {
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Bootstrapped Windows toolchain is incomplete: missing $path"
          }
        }

        # configure searches the inherited PATH before its discovered VS
        # path. GITHUB_PATH prepends the verified compiler directory so a
        # partial machine Visual Studio install cannot win the lookup.
        $vcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "Using bootstrapped MSVC toolchain $($msvcPath.FullName)"
