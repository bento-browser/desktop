name: Set up Bento
description: Install pnpm and Node (from .nvmrc), then the frozen dependency graph unless install is false.

inputs:
  install:
    description: Run a frozen-lockfile install after the toolchain setup ('true' or 'false').
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Restore the pnpm store only when this job installs from it.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      # The one committed lock; drift between it and the manifests fails.
      run: pnpm install --frozen-lockfile
