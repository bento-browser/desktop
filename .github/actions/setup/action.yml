name: Set up Bento
description: Install pnpm and Node (from .nvmrc), then the frozen dependency graph unless install is false.

inputs:
  install:
    description: Run a frozen-lockfile install after the toolchain setup ('true' or 'false').
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.33.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        # Restore the pnpm store only when this job installs from it.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      # The one committed lock; drift between it and the manifests fails.
      run: pnpm install --frozen-lockfile
