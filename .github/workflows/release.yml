name: Release

# Tag-driven release. Tag the repo with `v0.1.0` (matching surfer.json's
# version) and the workflow builds Bento for macOS, Linux, and Windows in parallel,
# then attaches the artifacts to a draft GitHub Release. The Release stays
# in draft until you publish it manually — final review of the artifacts +
# notes before users see them.
#
# workflow_dispatch is also wired so the workflow can be triggered manually
# from the Actions tab without tagging — useful for smoke-testing the
# pipeline end-to-end before a real release. Manual runs upload artifacts
# to the workflow run only (no Release is created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = Apple Silicon (aarch64) with Xcode 26.x / macOS SDK 26.x.
        # Firefox 150+ configure rejects the older macOS 14 SDK as too old.
        # ubuntu-latest = Linux x86_64.
        # windows-latest = Windows Server 2022 x86_64.
        include:
          - os: macos-26
            build-jobs: ''
          # GitHub-hosted Linux and Windows runners can exhaust memory when
          # Firefox uses its default native-build parallelism.
          - os: ubuntu-latest
            build-jobs: '1'
          - os: windows-latest
            build-jobs: '1'
    runs-on: ${{ matrix.os }}
    # A cold optimized Firefox build can exceed three hours on hosted macOS.
    # Keep the job at GitHub's six-hour hosted-runner ceiling so the first
    # successful build can populate the native object cache.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cache Firefox source between runs so the 6 GB+ download isn't
      # repeated for every release. Cache key includes surfer.json hash so
      # a Firefox version bump invalidates the cache.
      - name: Cache engine/
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine
          key: ${{ runner.os }}-engine-${{ hashFiles('surfer.json', 'patches/**') }}

      # Cache mach build artifacts so an incremental release that only
      # changes Bento extensions doesn't re-link the entire engine. The
      # key is keyed on the exact build-tool package/config + patches (the things that affect
      # native compile output) and intentionally NOT on github.sha, so
      # commits that only touch extensions/, scripts/, or branding/ hit
      # the cache and skip the multi-hour relink step.
      - name: Cache engine/obj-*
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine/obj-*
          key: ${{ runner.os }}-obj-${{ hashFiles('surfer.json', 'patches/**', 'package.json') }}

      # Install dependencies in release mode so the @tale-ui/* deps
      # resolve from npm (not local link). build-release.sh re-runs this
      # internally for safety, but we install up front because the
      # `surfer download` / `surfer bootstrap` steps below need surfer
      # itself on disk before they can invoke it.
      - name: Install dependencies (release mode)
        env:
          BENTO_RELEASE: '1'
        run: pnpm install --no-frozen-lockfile

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Install MozillaBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Surfer download (Firefox source)
        run: pnpm run download

      - name: Surfer bootstrap (Mozilla build toolchain)
        run: pnpm run bootstrap

      - name: Build release artifact
        env:
          BENTO_RELEASE: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
        # build-release.sh handles platform detection, runs the full
        # ext:build → import → surfer build → surfer package chain, and
        # drops a versioned artifact into release-out/.
        # Bash on Windows runners is git-bash which handles the script
        # syntax fine.
        run: bash scripts/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bento-${{ runner.os }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a Release on tag pushes. Manual workflow_dispatch runs
    # leave the artifacts on the workflow run page for inspection.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-macOS
          path: release-out/

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-Linux
          path: release-out/

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-Windows
          path: release-out/

      - name: List collected artifacts
        run: ls -la release-out/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Draft: stays unpublished until you flip the toggle in the UI.
          # Lets you review artifacts + write release notes before users
          # see anything.
          draft: true
          # Prerelease until we sign + notarize. The release-out/ artifacts
          # are unsigned during the developer-preview phase; macOS users
          # need to right-click → Open the .dmg to bypass Gatekeeper.
          # Document this in the release body when publishing.
          prerelease: true
          files: release-out/*
          # Generate the release-body skeleton from PRs since the last
          # tag. We override on publish if needed.
          generate_release_notes: true
