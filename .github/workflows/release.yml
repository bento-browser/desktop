name: Release

# Tag-driven release. Tag the repo with `v0.0.1` (matching
# bento.json's brands.bento.release.displayVersion) and the workflow builds Bento
# for macOS, Linux, and Windows in parallel,
# then attaches the artifacts to a draft GitHub Release. The Release stays
# in draft until you publish it manually — final review of the artifacts +
# notes before users see them.
#
# workflow_dispatch is also wired so the workflow can be triggered manually
# from the Actions tab without tagging — useful for smoke-testing the
# pipeline end-to-end before a real release. Manual runs upload artifacts
# to the workflow run only (no Release is created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = Apple Silicon (aarch64) with Xcode 26.x / macOS SDK 26.x.
        # Firefox 150+ configure rejects the older macOS 14 SDK as too old.
        # ubuntu-latest = Linux x86_64.
        # windows-latest = Windows Server 2022 x86_64.
        include:
          - os: blacksmith-6vcpu-macos-26
            build-jobs: ''
          # Blacksmith Linux runners provide 16 GiB RAM; four native workers
          # match the available vCPUs while Rust ThinLTO bounds the gkrust link.
          # Windows keeps two workers on the 14 GiB runner.
          - os: blacksmith-4vcpu-ubuntu-2404
            build-jobs: '4'
          - os: blacksmith-4vcpu-windows-2025
            build-jobs: '2'
    runs-on: ${{ matrix.os }}
    # A cold optimized Firefox build can exceed three hours on hosted macOS.
    # Keep the job at GitHub's six-hour hosted-runner ceiling so the first
    # successful build can populate the native object cache.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: node scripts/check-rust-toolchain.mjs

      # Cache Firefox source between runs so the 6 GB+ download isn't
      # repeated for every release. Keep native objects separate so source
      # restores do not duplicate the multi-GB object cache.
      - name: Cache Firefox source (engine/)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            engine/*
            engine/.[!.]*
            !engine/obj-*
            .bento/source-state.json
            .bento/import-manifest.json
            .bento/engine-state.json
          key: ${{ runner.os }}-bento-engine-source-v1-release-${{ hashFiles('bento.json', 'config/**', 'patches/**', 'src/**', 'branding/bento/**', 'extensions/**', 'prefs/**', 'scripts/bento-build.mjs', 'scripts/import-sources.mjs', 'scripts/import.sh', 'scripts/install-branding.mjs', 'scripts/install-builtin-addons.mjs', 'scripts/firefox-patch-stack.mjs') }}

      # Install dependencies in release mode so the @tale-ui/* deps
      # resolve from npm (not local link). build-release.sh re-runs this
      # internally for safety, but we install up front because the Bento
      # download and bootstrap steps below need the repository's
      # build driver and its release dependency graph on disk first.
      - name: Install dependencies (release mode)
        run: bash scripts/install-release-deps.sh

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Install MozillaBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Bento download (Firefox source)
        run: pnpm run download

      # Cache mach build artifacts so an incremental release that only
      # changes Bento extensions doesn't re-link the entire engine. The key
      # intentionally excludes github.sha so extension-only commits reuse it.
      # Restore this only after source download: Bento's source command checks
      # the protected engine checkout before using the restored object tree.
      - name: Cache engine/obj-*
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine/obj-*
          key: ${{ runner.os }}-bento-obj-v1-release-${{ hashFiles('bento.json', 'config/**', 'patches/**', 'package.json', 'configs/**', 'rust-toolchain.toml', 'pnpm-lock.release.yaml', 'scripts/bento-build.mjs', 'scripts/mach-raw.sh') }}

      - name: Bento bootstrap (Mozilla build toolchain)
        run: pnpm run bootstrap

      - name: Select bootstrapped Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stateDir = if ($env:MOZBUILD_STATE_PATH) {
            $env:MOZBUILD_STATE_PATH
          } else {
            Join-Path $env:USERPROFILE '.mozbuild'
          }
          $msvcRoot = Join-Path $stateDir 'vs\VC\Tools\MSVC'
          if (-not (Test-Path -LiteralPath $msvcRoot -PathType Container)) {
            throw "Bootstrapped Visual C++ tree not found at $msvcRoot"
          }

          $msvcPath = Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1
          if (-not $msvcPath) {
            throw "No bootstrapped MSVC version found under $msvcRoot"
          }

          $vcBin = Join-Path $msvcPath.FullName 'bin\Hostx64\x64'
          $required = @(
            (Join-Path $vcBin 'cl.exe'),
            (Join-Path $msvcPath.FullName 'atlmfc\include\atlbase.h'),
            (Join-Path $msvcPath.FullName 'atlmfc\lib\x64\atls.lib')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Bootstrapped Windows toolchain is incomplete: missing $path"
            }
          }

          # configure searches inherited PATH before its discovered VS path.
          $vcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "Using bootstrapped MSVC toolchain $($msvcPath.FullName)"

      - name: Build release artifact
        env:
          BENTO_RELEASE: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
        # build-release.sh handles platform detection, runs the full
        # ext:build → import → Bento build → Bento package chain, and
        # drops a versioned artifact into release-out/.
        # Bash on Windows runners is git-bash which handles the script
        # syntax fine.
        run: bash scripts/build-release.sh

      - name: Validate Bento package, MAR, and update XML outputs
        run: pnpm run artifacts:check

      - name: Validate release-out collection
        shell: bash
        run: |
          set -euo pipefail
          mar_count="$(find release-out -maxdepth 1 -type f -name '*.mar' | wc -l | tr -d ' ')"
          xml_count="$(find release-out -maxdepth 1 -type f -name '*-update.xml' | wc -l | tr -d ' ')"
          [ "$mar_count" -eq 1 ] || { echo "expected one release-out MAR, found $mar_count" >&2; exit 1; }
          [ "$xml_count" -gt 0 ] || { echo 'release-out is missing update XML' >&2; exit 1; }
          echo "release-out contains one MAR and $xml_count update XML file(s)"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bento-${{ runner.os }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Only create a Release on tag pushes. Manual workflow_dispatch runs
    # leave the artifacts on the workflow run page for inspection.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frozen release dependencies
        run: bash scripts/install-release-deps.sh

      - name: Enforce preview release gate
        run: pnpm run release:security-check

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-macOS
          path: release-out/

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-Linux
          path: release-out/

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bento-Windows
          path: release-out/

      - name: List collected artifacts
        run: ls -la release-out/

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-release-sbom.mjs release-out

      - name: Generate release manifest and SHA-256 checksums
        run: node scripts/generate-release-metadata.mjs release-out

      - name: Attest release artifact provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: release-out/SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Draft: stays unpublished until you flip the toggle in the UI.
          # Lets you review artifacts + write release notes before users
          # see anything.
          draft: true
          # Prerelease until we sign + notarize. The release-out/ artifacts
          # are unsigned during the developer-preview phase; macOS users
          # need to right-click → Open the .dmg to bypass Gatekeeper.
          # Document this in the release body when publishing.
          prerelease: true
          files: release-out/*
          # Generate the release-body skeleton from PRs since the last
          # tag. We override on publish if needed.
          generate_release_notes: true
