name: Release

# Tag-driven release. Tag the repo with `v0.0.1` (matching
# bento.json's brands.bento.release.displayVersion) and the workflow builds Bento
# for macOS, Linux, and Windows in parallel,
# then attaches the artifacts to a draft GitHub Release. The Release stays
# in draft until you publish it manually — final review of the artifacts +
# notes before users see them.
#
# workflow_dispatch is also wired so the workflow can be triggered manually
# from the Actions tab without tagging — useful for smoke-testing the
# pipeline end-to-end before a real release. Manual runs upload artifacts
# to the workflow run only (no Release is created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: Release security gate
    # Runs before any native build starts: a tag on a tree that fails these
    # checks must not spend three six-hour builds first. The release job runs
    # the release checks again next to the artifacts it publishes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # The release security test parses the lockfile, so this job installs.
      - uses: ./.github/actions/setup

      - name: Bento security invariants
        run: pnpm run security:check

      - name: Enforce preview release gate
        run: pnpm run release:security-check

      - name: Verify release security assertions
        run: node --test scripts/release-security.test.mjs

      - name: Dependency audit
        run: pnpm audit --audit-level high

  build:
    name: Build (${{ matrix.os }})
    needs: security-gate
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted public standard profiles: Linux and Windows x64 provide
        # 4 CPUs / 16 GiB; macos-26 provides 3 M1 CPUs / 7 GiB on Apple Silicon.
        # macos-26 uses the current macOS SDK for the Firefox 150+ build.
        # Firefox 150+ configure rejects the older macOS 14 SDK as too old.
        # ubuntu-24.04 = Linux x86_64; windows-2025 = Windows Server 2025 x86_64.
        include:
          - os: macos-26
            # The standard Apple Silicon image has 7 GiB RAM; keep its native
            # build serial while macOS retains Firefox's default fat LTO.
            build-jobs: '1'
          # Keep the existing native worker caps for hosted-runner memory
          # stability; Rust ThinLTO bounds the gkrust link on both platforms.
          - os: ubuntu-24.04
            build-jobs: '4'
          - os: windows-2025
            build-jobs: '2'
    runs-on: ${{ matrix.os }}
    # A cold optimized Firefox build can exceed three hours on hosted macOS.
    # Keep the job at GitHub's six-hour hosted-runner ceiling so the first
    # successful build can populate the native object cache.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Installs the frozen graph up front. build-release.sh runs the same
      # frozen install again (it also serves local release builds), which does
      # nothing when node_modules is already current.
      - uses: ./.github/actions/setup

      - name: Resolve pinned Rust toolchain
        run: node scripts/check-rust-toolchain.mjs

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # Pristine source keyed by Firefox version and source digest, shared with
      # ci.yml. The native caches are restored only after it, because Bento's
      # source command checks the protected engine checkout before using a
      # restored object tree.
      - name: Firefox source (engine/)
        uses: ./.github/actions/engine-source

      # Keys are shared with ci.yml. Release runs on a tag restore but never
      # save: a cache written under a tag ref is invisible to the next tag. Run
      # CI manually on main to seed these caches for release builds.
      - name: Native cache keys
        id: native-keys
        uses: ./.github/actions/native-cache-keys

      - name: Restore Mozilla toolchain state (~/.mozbuild)
        id: mozbuild-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-keys.outputs.mozbuild-path }}
          key: ${{ steps.native-keys.outputs.mozbuild-key }}

      - name: Restore native object tree (engine/obj-bento)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-keys.outputs.object-path }}
          key: ${{ steps.native-keys.outputs.object-key }}
          restore-keys: ${{ steps.native-keys.outputs.object-restore-keys }}

      - name: Install MozillaBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Bento bootstrap (Mozilla build toolchain)
        run: pnpm run bootstrap

      # Saved right after a successful bootstrap so a later failure cannot
      # store a half-installed toolchain. A hit is never saved again.
      - name: Save Mozilla toolchain state (~/.mozbuild)
        if: github.ref_type != 'tag' && steps.mozbuild-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-keys.outputs.mozbuild-path }}
          key: ${{ steps.native-keys.outputs.mozbuild-key }}

      - name: Select bootstrapped Windows toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/select-windows-toolchain

      - name: Build release artifact
        id: native-build
        # Stop the build with time left in the job to save the partial object
        # tree below; the next run resumes from it.
        timeout-minutes: 320
        env:
          BENTO_RELEASE: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
        # build-release.sh handles platform detection, runs the full
        # ext:build → import → Bento build → Bento package chain, and
        # drops a versioned artifact into release-out/.
        # Bash on Windows runners is git-bash which handles the script
        # syntax fine.
        run: bash scripts/build-release.sh

      # The updater is compiled out until bento.json updates.enabled is true, so
      # the build neither produces nor may publish a MAR or update XML.
      - name: Validate Bento package outputs (and MAR and update XML when the updater is enabled)
        run: pnpm run artifacts:check

      - name: Validate release-out collection
        shell: bash
        run: |
          set -euo pipefail
          updates_enabled="$(node -p "require('./bento.json').updates?.enabled === true")"
          mar_count="$(find release-out -maxdepth 1 -type f -name '*.mar' | wc -l | tr -d ' ')"
          xml_count="$(find release-out -maxdepth 1 -type f -name '*-update.xml' | wc -l | tr -d ' ')"
          if [ "$updates_enabled" = "true" ]; then
            [ "$mar_count" -eq 1 ] || { echo "expected one release-out MAR, found $mar_count" >&2; exit 1; }
            [ "$xml_count" -gt 0 ] || { echo 'release-out is missing update XML' >&2; exit 1; }
            echo "release-out contains one MAR and $xml_count update XML file(s)"
          else
            [ "$mar_count" -eq 0 ] && [ "$xml_count" -eq 0 ] || { echo "release-out holds $mar_count MAR and $xml_count update XML file(s), but the updater is disabled" >&2; exit 1; }
            echo 'release-out holds no MAR or update XML (updater disabled)'
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bento-${{ runner.os }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

      # Saved even when the build failed or timed out: mach is incremental, so
      # a partial tree still shortens the next run. Every save is a new entry
      # (the key holds the run id); GitHub evicts the oldest at the size cap.
      - name: Save native object tree (engine/obj-bento)
        if: always() && github.ref_type != 'tag' && steps.native-build.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-keys.outputs.object-path }}
          key: ${{ steps.native-keys.outputs.object-key }}

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only create a Release on tag pushes. Manual workflow_dispatch runs
    # leave the artifacts on the workflow run page for inspection.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Enforce preview release gate
        run: pnpm run release:security-check

      - name: Verify release security assertions
        run: node --test scripts/release-security.test.mjs

      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bento-macOS
          path: release-out/

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bento-Linux
          path: release-out/

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bento-Windows
          path: release-out/

      - name: List collected artifacts
        run: ls -la release-out/

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-release-sbom.mjs release-out

      - name: Generate release manifest and SHA-256 checksums
        run: node scripts/generate-release-metadata.mjs release-out

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-out/SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Draft: stays unpublished until you flip the toggle in the UI.
          # Lets you review artifacts + write release notes before users
          # see anything.
          draft: true
          # Prerelease until we sign + notarize. The release-out/ artifacts
          # are unsigned during the developer-preview phase; macOS users
          # need to right-click → Open the .dmg to bypass Gatekeeper.
          # Document this in the release body when publishing.
          prerelease: true
          files: release-out/*
          # Generate the release-body skeleton from PRs since the last
          # tag. We override on publish if needed.
          generate_release_notes: true
