name: CodeQL

on:
  push:
    branches: [main]
  # A pull request that changes only docs/ or Markdown has nothing for the scan
  # and skips it. Push to main and the weekly schedule still scan everything, so
  # main always has a fresh analysis. If a ruleset ever requires the "Analyze
  # Bento JavaScript and TypeScript" check, a path-filtered workflow leaves it
  # pending on those pull requests: remove this filter or add GitHub's
  # documented skip-workflow pattern.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Bento JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'
