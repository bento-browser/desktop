name: CodeQL

on:
  push:
    branches: [main]
  # A pull request that changes only docs/ or Markdown has nothing for the scan
  # and skips it. Push to main and the weekly schedule still scan everything, so
  # main always has a fresh analysis. If a ruleset ever requires the "Analyze
  # Bento JavaScript and TypeScript" check, a path-filtered workflow leaves it
  # pending on those pull requests: remove this filter or add GitHub's
  # documented skip-workflow pattern.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Bento JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:javascript-typescript'
