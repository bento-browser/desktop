name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: JSON, shell, prefs sanity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/install-release-deps.sh

      - name: Validate JSON syntax
        run: |
          set -e
          for f in surfer.json package.json config/firefox-versions.json config/allowed-zen-references.json tsconfig.json .surfer/dynamicConfig.brand.json .size-limit.json; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Validate surfer.json brand schema
        # Keep only fields understood by the pinned upstream package.
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('surfer.json','utf8'));
            const required = ['name','vendor','appId','binaryName','version','brands'];
            for (const k of required) if (!(k in c)) throw new Error('surfer.json missing: ' + k);
            for (const [name, b] of Object.entries(c.brands)) {
              for (const k of ['backgroundColor','brandShorterName','brandShortName','brandFullName','release']) {
                if (!(k in b)) throw new Error('brand ' + name + ' missing: ' + k);
              }
              if (!b.release.displayVersion) throw new Error('brand ' + name + ' missing release.displayVersion');
            }
            console.log('surfer.json brand schema OK');
          "

      - name: Shell script syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Verify prefs/bento.js parses as JS
        # Default-pref files are evaluated by Firefox at startup. Catch syntax
        # errors before they become runtime failures inside the browser.
        run: node --check prefs/bento.js

      - name: Firefox patch stack tests
        run: pnpm run firefox:patches:test

      - name: Branding and built-in add-on installer tests
        run: node --test scripts/install-branding.test.mjs scripts/install-builtin-addons.test.mjs scripts/bento-privacy-security.test.mjs scripts/release-security.test.mjs scripts/rust-thin-lto.test.mjs scripts/pr-build-comment.test.mjs

      - name: Zen reference boundary
        run: pnpm run check:zen-boundary

      - name: Zen reference boundary tests
        run: pnpm run test:boundary-detector

      - name: Bento security invariants
        run: pnpm run security:check

      - name: Preview release security gate
        run: pnpm run release:security-check

      - name: Dependency audit
        run: pnpm audit --audit-level high

  extensions:
    name: Extensions — typecheck, lint, build, size-limit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # BENTO_RELEASE=1 short-circuits the .pnpmfile.cjs readPackage hook
        # so @tale-ui/* resolve from npm at the pinned versions in
        # package.json. Without it the hook would rewrite them to
        # `link:/Users/admin/Projects/tale-ui/tale-ui/packages/*` (the local
        # dev path) which doesn't exist on the runner. The helper installs
        # the committed registry-backed release lock without permitting drift.
        run: bash scripts/install-release-deps.sh

      - name: Typecheck (shell)
        run: pnpm --filter @bento/shell typecheck

      - name: Typecheck (tools)
        run: pnpm --filter @bento/tools typecheck

      - name: Lint (shell)
        run: pnpm --filter @bento/shell lint

      - name: Lint (tools)
        run: pnpm --filter @bento/tools lint

      - name: Build extensions
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build

      - name: Size budget
        # Fails the job if any bundle breaches its graph-aware JS budget or
        # direct file budget. JS entry budgets live in
        # scripts/check-size-budgets.mjs; CSS/background budgets live in
        # .size-limit.json.
        run: pnpm run size:check

  surfer-smoke:
    name: Surfer config loads
    needs: static-checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        # See `extensions` job above for the separate frozen release lock.
        run: bash scripts/install-release-deps.sh
      - name: Surfer reads our config
        # `surfer --version` parses surfer.json end-to-end and exits non-zero
        # if any required field is missing. Our cheapest end-to-end check.
        run: pnpm exec surfer --version | tee surfer-version.txt && grep -F '1.14.7' surfer-version.txt
      - name: Surfer license check
        run: pnpm run lc

  build:
    name: Build (${{ matrix.platform }})
    needs: surfer-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
            build-jobs: '1'
          - platform: macos-arm64
            os: blacksmith-6vcpu-macos-26
            build-jobs: ''
          - platform: windows-x64
            os: blacksmith-4vcpu-windows-2025
            build-jobs: '2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        # See `extensions` job above for the separate frozen release lock.
        run: bash scripts/install-release-deps.sh

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Cache Firefox source (engine/)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine
          key: ${{ runner.os }}-engine-${{ hashFiles('surfer.json', 'patches/**') }}

      - name: Cache Firefox object files (engine/obj-*)
        if: github.event_name == 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine/obj-*
          key: ${{ runner.os }}-obj-${{ hashFiles('surfer.json', 'patches/**', 'package.json', 'configs/**', 'rust-toolchain.toml', 'pnpm-lock.release.yaml') }}

      - name: Resolve pinned Rust toolchain
        if: github.event_name == 'pull_request'
        run: node scripts/check-rust-toolchain.mjs

      - name: Surfer download
        run: pnpm run download

      - name: Install MozillaBuild
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Build extensions and import Bento sources
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build && pnpm run import

      - name: Verify repeated import is idempotent
        env:
          BENTO_RELEASE: '1'
        run: |
          node scripts/snapshot-import-output.mjs > import-first.sha256
          pnpm run import
          node scripts/snapshot-import-output.mjs > import-second.sha256
          node -e "const fs=require('fs'); if(fs.readFileSync('import-first.sha256','utf8')!==fs.readFileSync('import-second.sha256','utf8')) process.exit(1)"

      - name: Verify imported branding, add-ons, patches, and identity
        run: node scripts/check-import-output.mjs

      - name: Surfer bootstrap (Mozilla build toolchain)
        if: github.event_name == 'pull_request'
        run: pnpm run bootstrap

      - name: Build PR release artifact
        if: github.event_name == 'pull_request'
        env:
          BENTO_RELEASE: '1'
          BENTO_PR_BUILD: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
        run: bash scripts/build-release.sh

      - name: Upload PR build artifact
        id: upload-pr-artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: release-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add PR build link to job summary
        if: github.event_name == 'pull_request' && success()
        shell: bash
        env:
          ARTIFACT_NAME: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.upload-pr-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Bento PR test build'
            echo
            echo "[${ARTIFACT_NAME}](${ARTIFACT_URL})"
            echo
            echo 'Unsigned PR-scoped test build; GitHub sign-in required. Artifact retention: 14 days.'
            echo "[View CI run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
