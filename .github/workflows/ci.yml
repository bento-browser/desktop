name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform for the manual application test build
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - macos-arm64
          - windows-x64
          - all

concurrency:
  # Manual native runs have a separate namespace so a routine PR update never
  # cancels an explicitly requested application build.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'routine' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: JSON, shell, prefs sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/install-release-deps.sh

      - name: Validate JSON syntax
        run: |
          set -e
          for f in bento.json package.json config/firefox-versions.json config/allowed-zen-references.json tsconfig.json .size-limit.json; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Validate bento.json schema
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('bento.json','utf8'));
            const required = ['schemaVersion','name','vendor','appId','binaryName','brand','firefox','build','brands','locales','license','updates'];
            for (const k of required) if (!(k in c)) throw new Error('bento.json missing: ' + k);
            if (c.schemaVersion !== 1) throw new Error('bento.json schemaVersion must be 1');
            if (c.brand !== 'bento' || !c.brands.bento) throw new Error('bento.json must select the bento brand');
            if (!c.firefox.product || !c.firefox.version || !c.firefox.source?.archiveBaseUrl || !c.firefox.source?.sha256) throw new Error('bento.json Firefox source is incomplete');
            if (!['dev','debug','release'].includes(c.build.mode)) throw new Error('bento.json build.mode is invalid');
            if (!c.brands.bento.release?.displayVersion) throw new Error('bento.json release.displayVersion is missing');
            if (!c.updates.hostname || !c.updates.channel) throw new Error('bento.json update configuration is incomplete');
            console.log('bento.json schema OK');
          "

      - name: Shell script syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Verify prefs/bento.js parses as JS
        # Default-pref files are evaluated by Firefox at startup. Catch syntax
        # errors before they become runtime failures inside the browser.
        run: node --check prefs/bento.js

      - name: Firefox patch stack tests
        run: pnpm run firefox:patches:test

      - name: Branding and built-in add-on installer tests
        run: node --test scripts/install-branding.test.mjs scripts/install-builtin-addons.test.mjs scripts/bento-privacy-security.test.mjs scripts/import-sources.test.mjs scripts/validate-bento-artifacts.test.mjs scripts/release-security.test.mjs scripts/rust-thin-lto.test.mjs scripts/pr-build-comment.test.mjs

      - name: Zen reference boundary
        run: pnpm run check:zen-boundary

      - name: Zen reference boundary tests
        run: pnpm run test:boundary-detector

      - name: Bento security invariants
        run: pnpm run security:check

      - name: Preview release security gate
        run: pnpm run release:security-check

      - name: Dependency audit
        run: pnpm audit --audit-level high

  extensions:
    name: Extensions — typecheck, lint, build, size-limit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # BENTO_RELEASE=1 short-circuits the .pnpmfile.cjs readPackage hook
        # so @tale-ui/* resolve from npm at the pinned versions in
        # package.json. Without it the hook would rewrite them to
        # `link:/Users/admin/Projects/tale-ui/tale-ui/packages/*` (the local
        # dev path) which doesn't exist on the runner. The helper installs
        # the committed registry-backed release lock without permitting drift.
        run: bash scripts/install-release-deps.sh

      - name: Typecheck (shell)
        run: pnpm --filter @bento/shell typecheck

      - name: Typecheck (tools)
        run: pnpm --filter @bento/tools typecheck

      - name: Lint (shell)
        run: pnpm --filter @bento/shell lint

      - name: Lint (tools)
        run: pnpm --filter @bento/tools lint

      - name: Build extensions
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build

      - name: Size budget
        # Fails the job if any bundle breaches its graph-aware JS budget or
        # direct file budget. JS entry budgets live in
        # scripts/check-size-budgets.mjs; CSS/background budgets live in
        # .size-limit.json.
        run: pnpm run size:check

  bento-smoke:
    name: Bento build tooling loads
    needs: static-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        # See `extensions` job above for the separate frozen release lock.
        run: bash scripts/install-release-deps.sh
      - name: Bento build driver reads our config
        run: node -e "import('./scripts/bento-build.mjs').then(({loadConfig}) => { const c = loadConfig(); if (c.firefox.version !== '154.0') throw new Error('unexpected Firefox version'); console.log('bento.json loaded for Firefox ' + c.firefox.version); })"
      - name: Bento source license check
        run: pnpm run lc

  prepare-build:
    name: Select CI build platform
    needs: [bento-smoke, extensions]
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select-matrix.outputs.matrix }}
    steps:
      - name: Select allowlisted platform matrix
        id: select-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          linux='{"platform":"linux-x64","os":"ubuntu-24.04","build-jobs":"4"}'
          macos='{"platform":"macos-arm64","os":"macos-26","build-jobs":"1"}'
          windows='{"platform":"windows-x64","os":"windows-2025","build-jobs":"2"}'

          case "$EVENT_NAME:$PLATFORM" in
            workflow_dispatch:linux-x64) matrix="{\"include\":[$linux]}" ;;
            workflow_dispatch:macos-arm64) matrix="{\"include\":[$macos]}" ;;
            workflow_dispatch:windows-x64) matrix="{\"include\":[$windows]}" ;;
            workflow_dispatch:all) matrix="{\"include\":[$linux,$macos,$windows]}" ;;
            push:|pull_request:) matrix="{\"include\":[$linux]}" ;;
            *) echo "Unsupported CI event/platform: $EVENT_NAME:$PLATFORM" >&2; exit 1 ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Build' || 'Source import' }} (${{ matrix.platform }})
    needs: prepare-build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-build.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Keep routine source validation bounded separately from manual native builds.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 20 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        # See `extensions` job above for the separate frozen release lock.
        run: bash scripts/install-release-deps.sh

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Cache Firefox source (engine/)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep the native object tree in its own cache below. The old source
          # cache included engine/obj-* as well, doubling restore and save work.
          path: |
            engine/*
            engine/.[!.]*
            !engine/obj-*
            .bento/source-state.json
            .bento/import-manifest.json
            .bento/engine-state.json
          key: ${{ runner.os }}-bento-engine-source-v1-${{ github.event_name == 'workflow_dispatch' && 'release' || 'source' }}-${{ hashFiles('bento.json', 'config/**', 'patches/**', 'src/**', 'branding/bento/**', 'extensions/**', 'prefs/**', 'scripts/bento-build.mjs', 'scripts/import-sources.mjs', 'scripts/import.sh', 'scripts/install-branding.mjs', 'scripts/install-builtin-addons.mjs', 'scripts/firefox-patch-stack.mjs') }}

      - name: Bento download (Firefox source)
        run: pnpm run download

      - name: Cache Firefox object files (engine/obj-*)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engine/obj-*
          key: ${{ runner.os }}-bento-obj-v1-release-${{ hashFiles('bento.json', 'config/**', 'patches/**', 'package.json', 'configs/**', 'rust-toolchain.toml', 'pnpm-lock.release.yaml', 'scripts/bento-build.mjs', 'scripts/mach-raw.sh') }}

      - name: Install MozillaBuild
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Build extensions and import Bento sources
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build && pnpm run import

      - name: Verify repeated import is idempotent
        env:
          BENTO_RELEASE: '1'
        run: |
          node scripts/snapshot-import-output.mjs > import-first.sha256
          pnpm run import
          node scripts/snapshot-import-output.mjs > import-second.sha256
          node -e "const fs=require('fs'); if(fs.readFileSync('import-first.sha256','utf8')!==fs.readFileSync('import-second.sha256','utf8')) process.exit(1)"

      - name: Verify imported branding, add-ons, patches, and identity
        run: node scripts/check-import-output.mjs

      - name: Resolve pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-rust-toolchain.mjs

      - name: Bento bootstrap (Mozilla build toolchain)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run bootstrap

      - name: Select bootstrapped Windows toolchain
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $stateDir = if ($env:MOZBUILD_STATE_PATH) {
            $env:MOZBUILD_STATE_PATH
          } else {
            Join-Path $env:USERPROFILE '.mozbuild'
          }
          $msvcRoot = Join-Path $stateDir 'vs\VC\Tools\MSVC'
          if (-not (Test-Path -LiteralPath $msvcRoot -PathType Container)) {
            throw "Bootstrapped Visual C++ tree not found at $msvcRoot"
          }

          $msvcPath = Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1
          if (-not $msvcPath) {
            throw "No bootstrapped MSVC version found under $msvcRoot"
          }

          $vcBin = Join-Path $msvcPath.FullName 'bin\Hostx64\x64'
          $required = @(
            (Join-Path $vcBin 'cl.exe'),
            (Join-Path $msvcPath.FullName 'atlmfc\include\atlbase.h'),
            (Join-Path $msvcPath.FullName 'atlmfc\lib\x64\atls.lib')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Bootstrapped Windows toolchain is incomplete: missing $path"
            }
          }

          # configure searches the inherited PATH before its discovered VS
          # path. GITHUB_PATH prepends the verified compiler directory so a
          # partial machine Visual Studio install cannot win the lookup.
          $vcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "Using bootstrapped MSVC toolchain $($msvcPath.FullName)"

      - name: Build manual release artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          BENTO_RELEASE: '1'
          BENTO_PR_BUILD: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
        run: bash scripts/build-release.sh

      - name: Upload manual build artifact
        id: upload-pr-artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: release-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add manual build link to job summary
        if: github.event_name == 'workflow_dispatch' && success()
        shell: bash
        env:
          ARTIFACT_NAME: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.upload-pr-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Bento manual test build'
            echo
            echo "[${ARTIFACT_NAME}](${ARTIFACT_URL})"
            echo
            echo 'Unsigned PR-scoped test build; GitHub sign-in required. Artifact retention: 14 days.'
            echo "[View CI run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
