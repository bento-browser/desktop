name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Drafts already run this workflow in full, so a ready_for_review
    # trigger would only repeat the run on the same commit.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform for the manual application test build
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - macos-arm64
          - windows-x64
          - all

concurrency:
  # Manual native runs have a separate namespace so a routine PR update never
  # cancels an explicitly requested application build.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'routine' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    name: Security gate
    # Runs first and alone: the build job needs it, so an invariant, release
    # gate, or advisory failure stops the build before it starts. It reads the
    # tree and the lockfile only, so it installs no dependencies. It also
    # selects the build platforms, which keeps that allowlist out of the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select-matrix.outputs.matrix }}
    steps:
      - name: Select allowlisted platform matrix
        id: select-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          linux='{"platform":"linux-x64","os":"ubuntu-24.04","build-jobs":"4"}'
          macos='{"platform":"macos-arm64","os":"macos-26","build-jobs":"1"}'
          windows='{"platform":"windows-x64","os":"windows-2025","build-jobs":"2"}'

          case "$EVENT_NAME:$PLATFORM" in
            workflow_dispatch:linux-x64) matrix="{\"include\":[$linux]}" ;;
            workflow_dispatch:macos-arm64) matrix="{\"include\":[$macos]}" ;;
            workflow_dispatch:windows-x64) matrix="{\"include\":[$windows]}" ;;
            workflow_dispatch:all) matrix="{\"include\":[$linux,$macos,$windows]}" ;;
            push:|pull_request:) matrix="{\"include\":[$linux]}" ;;
            *) echo "Unsupported CI event/platform: $EVENT_NAME:$PLATFORM" >&2; exit 1 ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Bento security invariants
        run: pnpm run security:check

      - name: Preview release security gate
        run: pnpm run release:security-check

      - name: Dependency audit
        run: pnpm audit --audit-level high

  static-checks:
    name: JSON, shell, prefs sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Validate JSON syntax
        run: |
          set -e
          for f in bento.json package.json config/firefox-versions.json config/allowed-zen-references.json tsconfig.json .size-limit.json; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Validate bento.json schema
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('bento.json','utf8'));
            const required = ['schemaVersion','name','vendor','appId','binaryName','brand','firefox','build','brands','locales','license','updates'];
            for (const k of required) if (!(k in c)) throw new Error('bento.json missing: ' + k);
            if (c.schemaVersion !== 1) throw new Error('bento.json schemaVersion must be 1');
            if (c.brand !== 'bento' || !c.brands.bento) throw new Error('bento.json must select the bento brand');
            if (!c.firefox.product || !c.firefox.version || !c.firefox.source?.archiveBaseUrl || !c.firefox.source?.sha256) throw new Error('bento.json Firefox source is incomplete');
            if (!['dev','debug','release'].includes(c.build.mode)) throw new Error('bento.json build.mode is invalid');
            if (!c.brands.bento.release?.displayVersion) throw new Error('bento.json release.displayVersion is missing');
            if (!c.updates.hostname || !c.updates.channel) throw new Error('bento.json update configuration is incomplete');
            if (typeof c.updates.enabled !== 'boolean') throw new Error('bento.json updates.enabled must be true or false');
            console.log('bento.json schema OK');
          "

      - name: Shell script syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Verify prefs/bento.js parses as JS
        # Default-pref files are evaluated by Firefox at startup. Catch syntax
        # errors before they become runtime failures inside the browser.
        run: node --check prefs/bento.js

      - name: Verify Firefox-side JavaScript parses
        # The chrome mount script, migration host, and JSWindowActors load
        # inside Firefox, where a syntax error disables the whole shell. The
        # find guard fails the step if the directory ever moves.
        run: |
          set -e
          files=$(find src/browser \( -name '*.js' -o -name '*.mjs' \) | sort)
          test -n "$files"
          for f in $files; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Lint scripts, Firefox-side sources, and agent skills
        # The extension packages lint themselves in the extensions job; this
        # covers the code outside them with the root ESLint config.
        run: pnpm run lint:repo

      - name: Native preferences protocol drift
        # Fails when the generated protocol copies no longer match their source.
        run: pnpm run native-protocol:check

      - name: Firefox patch stack tests
        run: pnpm run firefox:patches:test

      - name: Agent skill script tests
        run: pnpm run test:agent-skills

      - name: Branding and built-in add-on installer tests
        run: node --test scripts/install-branding.test.mjs scripts/install-builtin-addons.test.mjs scripts/bento-privacy-security.test.mjs scripts/import-sources.test.mjs scripts/validate-bento-artifacts.test.mjs scripts/release-security.test.mjs scripts/rust-thin-lto.test.mjs scripts/pr-build-comment.test.mjs scripts/muxui-local.test.mjs scripts/muxui-source.test.mjs scripts/muxui-regenerator.test.mjs scripts/dev-profile-clean.test.mjs scripts/size-ratchet.test.mjs scripts/bento-build.test.mjs scripts/dev-reload.test.mjs scripts/theme-sheets.test.mjs scripts/check-firefox-compat.test.mjs scripts/mux-css.test.mjs scripts/legacy-aliases.test.mjs

      - name: Zen reference boundary
        run: pnpm run check:zen-boundary

      - name: Zen reference boundary tests
        run: pnpm run test:boundary-detector

      - name: Bento build driver reads our config
        # Proves bento.json loads, the Firefox version is well formed, and the
        # release channel in config/firefox-versions.json agrees with it. No
        # version literal, so Firefox upgrades do not need to edit this step.
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { loadConfig } from './scripts/bento-build.mjs';
            const c = loadConfig();
            const version = c.firefox.version;
            if (!/^[0-9]+(\.[0-9]+)+([A-Za-z][0-9A-Za-z.-]*|-[0-9A-Za-z.-]+)?\$/.test(version)) throw new Error('malformed Firefox version: ' + version);
            const versions = JSON.parse(fs.readFileSync('config/firefox-versions.json', 'utf8'));
            const release = versions.channels?.find((entry) => entry.channel === 'release');
            if (release?.version !== version) throw new Error('config/firefox-versions.json release version ' + release?.version + ' does not match bento.json ' + version);
            console.log('bento.json loaded for Firefox ' + version);
          "

      - name: Bento source license check
        # Last: it regenerates theme presets and chrome tokens in the worktree.
        run: pnpm run lc

  extensions:
    name: Extensions — typecheck, lint, build, size-limit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Typecheck (shell)
        run: pnpm --filter @bento/shell typecheck

      - name: Typecheck (tools)
        run: pnpm --filter @bento/tools typecheck

      - name: Lint (shell)
        run: pnpm --filter @bento/shell lint

      - name: Lint (tools)
        run: pnpm --filter @bento/tools lint

      - name: Legacy token alias cap
        # Fails when a shell stylesheet, or the total, uses more legacy aliases
        # (--neutral-*, --color-*, --space-*, --radius-*, --shadow-*) than
        # .legacy-alias-cap.json allows. The cap only goes down.
        run: pnpm run lint:aliases

      - name: Test (shell)
        run: pnpm --filter @bento/shell test

      - name: Test (tools)
        run: pnpm --filter @bento/tools test

      - name: Build extensions
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build

      - name: Release shell has no dev-only reload command
        # The release bundle must not ship the Alt+Shift+R handler
        # (scripts/dev-reload.mjs).
        run: pnpm run release:security-check:shell

      - name: Check size budgets
        # Fails when an entry grows past .size-baseline.json by more than
        # max(1%, 1 KB). Ceilings over the target are reported, not gated.
        # Missing or malformed built assets still fail.
        run: pnpm run size:check

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Build' || 'Source import' }} (${{ matrix.platform }})
    # The checks above run in parallel and all pass before any build starts, so
    # a failing tree never costs a long native build.
    needs: [security-gate, static-checks, extensions]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.security-gate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Keep routine source validation bounded separately from manual native builds.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 20 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # Pristine source keyed by Firefox version and source digest. The caches
      # below are restored only after it, because Bento's source command checks
      # the protected engine checkout before using a restored object tree.
      - name: Firefox source (engine/)
        id: engine-source
        uses: ./.github/actions/engine-source

      - name: Native cache keys
        id: native-keys
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/native-cache-keys

      - name: Restore Mozilla toolchain state (~/.mozbuild)
        id: mozbuild-cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-keys.outputs.mozbuild-path }}
          key: ${{ steps.native-keys.outputs.mozbuild-key }}

      - name: Restore native object tree (engine/obj-bento)
        id: object-cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-keys.outputs.object-path }}
          key: ${{ steps.native-keys.outputs.object-key }}
          restore-keys: ${{ steps.native-keys.outputs.object-restore-keys }}

      - name: Install MozillaBuild
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          choco install mozillabuild --version=4.2.1 --yes --no-progress
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild did not install at C:\mozilla-build'
          }

      - name: Build extensions and import Bento sources
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:build && pnpm run import

      - name: Verify repeated import is idempotent
        env:
          BENTO_RELEASE: '1'
        run: |
          node scripts/snapshot-import-output.mjs > import-first.sha256
          pnpm run import
          node scripts/snapshot-import-output.mjs > import-second.sha256
          node -e "const fs=require('fs'); if(fs.readFileSync('import-first.sha256','utf8')!==fs.readFileSync('import-second.sha256','utf8')) process.exit(1)"

      - name: Verify imported branding, add-ons, patches, and identity
        run: node scripts/check-import-output.mjs

      - name: Imported release shell has no dev-only reload command
        # Covers the manifest the installer copies into the engine as well.
        run: pnpm run release:security-check:shell

      - name: Resolve pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-rust-toolchain.mjs

      - name: Bento bootstrap (Mozilla build toolchain)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run bootstrap

      # Saved right after a successful bootstrap so a later failure cannot
      # store a half-installed toolchain. A hit is never saved again.
      - name: Save Mozilla toolchain state (~/.mozbuild)
        if: github.event_name == 'workflow_dispatch' && steps.mozbuild-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-keys.outputs.mozbuild-path }}
          key: ${{ steps.native-keys.outputs.mozbuild-key }}

      - name: Select bootstrapped Windows toolchain
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/select-windows-toolchain

      - name: Build manual release artifact
        if: github.event_name == 'workflow_dispatch'
        id: native-build
        # Stop the build with time left in the job to save the partial object
        # tree below; the next run resumes from it.
        timeout-minutes: 320
        env:
          BENTO_RELEASE: '1'
          BENTO_PR_BUILD: '1'
          BENTO_BUILD_JOBS: ${{ matrix.build-jobs }}
          # Dependencies, extensions, and the import already ran above.
          BENTO_RELEASE_PREPARED: '1'
        run: bash scripts/build-release.sh

      - name: Upload manual build artifact
        id: upload-pr-artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: release-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add manual build link to job summary
        if: github.event_name == 'workflow_dispatch' && success()
        shell: bash
        env:
          ARTIFACT_NAME: bento-pr-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.upload-pr-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Bento manual test build'
            echo
            echo "[${ARTIFACT_NAME}](${ARTIFACT_URL})"
            echo
            echo 'Unsigned PR-scoped test build; GitHub sign-in required. Artifact retention: 14 days.'
            echo "[View CI run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved even when the build failed or timed out: mach is incremental, so
      # a partial tree still shortens the next run. Every save is a new entry
      # (the key holds the run id); GitHub evicts the oldest at the size cap.
      - name: Save native object tree (engine/obj-bento)
        if: always() && github.event_name == 'workflow_dispatch' && steps.native-build.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-keys.outputs.object-path }}
          key: ${{ steps.native-keys.outputs.object-key }}

      - name: Cache summary
        if: always()
        shell: bash
        env:
          IS_NATIVE: ${{ github.event_name == 'workflow_dispatch' }}
          SOURCE_HIT: ${{ steps.engine-source.outputs.cache-hit }}
          MOZBUILD_HIT: ${{ steps.mozbuild-cache.outputs.cache-hit }}
          OBJECT_HIT: ${{ steps.object-cache.outputs.cache-hit }}
          OBJECT_MATCHED: ${{ steps.object-cache.outputs.cache-matched-key }}
        run: |
          {
            echo '### Build caches'
            echo
            echo "- Firefox source: $([ "$SOURCE_HIT" = true ] && echo hit || echo miss)"
            if [ "$IS_NATIVE" = true ]; then
              echo "- Mozilla toolchain (~/.mozbuild): $([ "$MOZBUILD_HIT" = true ] && echo hit || echo miss)"
              if [ "$OBJECT_HIT" = true ]; then
                echo "- Native objects: exact hit (\`$OBJECT_MATCHED\`)"
              elif [ -n "$OBJECT_MATCHED" ]; then
                echo "- Native objects: restored near-miss (\`$OBJECT_MATCHED\`)"
              else
                echo '- Native objects: cold build'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
