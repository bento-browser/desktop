name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: JSON, shell, prefs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate JSON syntax
        run: |
          set -e
          for f in surfer.json package.json config/firefox-versions.json tsconfig.json .surfer/dynamicConfig.brand.json; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Validate surfer.json brand schema
        # Catches the class of breakage we hit when scaffolding: missing
        # release.displayVersion, urls/installer fields renamed, etc.
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('surfer.json','utf8'));
            const required = ['name','vendor','appId','binaryName','version','brands'];
            for (const k of required) if (!(k in c)) throw new Error('surfer.json missing: ' + k);
            for (const [name, b] of Object.entries(c.brands)) {
              for (const k of ['backgroundColor','brandShorterName','brandShortName','brandFullName','release']) {
                if (!(k in b)) throw new Error('brand ' + name + ' missing: ' + k);
              }
              if (!b.release.displayVersion) throw new Error('brand ' + name + ' missing release.displayVersion');
            }
            console.log('surfer.json brand schema OK');
          "

      - name: Shell script syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: Verify prefs/bento.js parses as JS
        # Default-pref files are evaluated by Firefox at startup. Catch syntax
        # errors before they become runtime failures inside the browser.
        run: node --check prefs/bento.js

  surfer-smoke:
    name: Surfer config loads
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Surfer reads our config
        # `surfer --version` parses surfer.json end-to-end and exits non-zero
        # if any required field is missing. Our cheapest end-to-end check.
        run: npx surfer --version
      - name: Surfer license check
        run: npm run lc

  build:
    name: Build (${{ matrix.os }})
    needs: surfer-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Firefox source (engine/)
        uses: actions/cache@v4
        with:
          path: engine
          key: ${{ runner.os }}-engine-${{ hashFiles('surfer.json') }}

      - name: Surfer download
        run: npm run download

      # The full build (`npm run build`) requires the Mozilla build toolchain
      # (Rust, clang, ~30 GB disk, ~30–60 min wall time on hosted runners).
      # Disabled until self-hosted or beefier runners are wired up.
      #
      # - name: Surfer bootstrap
      #   run: npm run bootstrap
      # - name: Surfer build
      #   run: npm run build
      # - name: Surfer package
      #   run: npm run package
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: bento-${{ runner.os }}
      #     path: dist/
