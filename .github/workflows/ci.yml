name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Drafts already run this workflow in full, so a ready_for_review
    # trigger would only repeat the run on the same commit.
    types: [opened, synchronize, reopened]

# CI never builds the application. Bento targets macOS only for now, and
# application builds (dev and release) run locally on the maintainer's Mac.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    name: Security gate
    # Cheap and independent: it reads the tree and the lockfile only, so it
    # installs no dependencies. source-import needs it, so an invariant,
    # release gate, or advisory failure stops the Firefox source download
    # before it starts.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Bento security invariants
        run: pnpm run security:check

      - name: Preview release security gate
        run: pnpm run release:security-check

      - name: Dependency audit
        run: pnpm audit --audit-level high

  changes:
    name: Detect import inputs
    # Decides whether source-import has anything to check. A pull request whose
    # changed files cannot affect the import skips that job (the path rule is
    # scripts/import-inputs.mjs). Every push to main runs it, which keeps the
    # engine source cache seeded for pull requests. Any doubt means run it. It
    # installs nothing, so the script runs on the runner's own Node and may use
    # only built-in modules.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      import: ${{ steps.detect.outputs.import }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the diff against the
          # first parent is exactly what the pull request changes.
          fetch-depth: 2

      - name: Decide whether source-import runs
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          import=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # NUL-separated changed paths in, `true` or `false` out. A missing
            # merge parent, a failed diff, or a failed script all mean true.
            if git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              import=$(git diff --name-only --no-renames -z HEAD^1 HEAD | node scripts/import-inputs.mjs) || import=true
            fi
          fi
          case "$import" in true | false) ;; *) import=true ;; esac
          echo "source-import needed: $import"
          echo "import=$import" >> "$GITHUB_OUTPUT"

  static-checks:
    name: JSON, shell, prefs sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Validate JSON syntax
        run: |
          set -e
          for f in bento.json package.json config/firefox-versions.json config/allowed-zen-references.json .size-limit.json; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Validate bento.json schema
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('bento.json','utf8'));
            const required = ['schemaVersion','name','vendor','appId','binaryName','brand','firefox','build','brands','locales','license','updates'];
            for (const k of required) if (!(k in c)) throw new Error('bento.json missing: ' + k);
            if (c.schemaVersion !== 1) throw new Error('bento.json schemaVersion must be 1');
            if (c.brand !== 'bento' || !c.brands.bento) throw new Error('bento.json must select the bento brand');
            if (!c.firefox.product || !c.firefox.version || !c.firefox.source?.archiveBaseUrl || !c.firefox.source?.sha256) throw new Error('bento.json Firefox source is incomplete');
            if (!['dev','debug','release'].includes(c.build.mode)) throw new Error('bento.json build.mode is invalid');
            if (!c.brands.bento.release?.displayVersion) throw new Error('bento.json release.displayVersion is missing');
            if (!c.updates.hostname || !c.updates.channel) throw new Error('bento.json update configuration is incomplete');
            if (typeof c.updates.enabled !== 'boolean') throw new Error('bento.json updates.enabled must be true or false');
            console.log('bento.json schema OK');
          "

      - name: Shell script syntax (bash -n)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Verify prefs/bento.js parses as JS
        # Default-pref files are evaluated by Firefox at startup. Catch syntax
        # errors before they become runtime failures inside the browser.
        run: node --check prefs/bento.js

      - name: Verify Firefox-side JavaScript parses
        # The chrome mount script, migration host, and JSWindowActors load
        # inside Firefox, where a syntax error disables the whole shell. The
        # find guard fails the step if the directory ever moves.
        run: |
          set -e
          files=$(find src/browser \( -name '*.js' -o -name '*.mjs' \) | sort)
          test -n "$files"
          for f in $files; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Lint scripts, Firefox-side sources, and agent skills
        # The extension packages lint themselves in the extensions-checks job;
        # this covers the code outside them with the root ESLint config.
        run: pnpm run lint:repo

      - name: Markdown links and anchors
        # Relative links and #anchors in CLAUDE.md, README.md, and docs/**/*.md.
        run: pnpm run check:doc-links

      - name: Firefox patch stack tests
        run: pnpm run firefox:patches:test

      - name: Agent skill script tests
        run: pnpm run test:agent-skills

      - name: Branding and built-in add-on installer tests
        run: node --test scripts/install-branding.test.mjs scripts/install-builtin-addons.test.mjs scripts/bento-privacy-security.test.mjs scripts/import-sources.test.mjs scripts/validate-bento-artifacts.test.mjs scripts/release-security.test.mjs scripts/ci-build-guard.test.mjs scripts/rust-thin-lto.test.mjs scripts/muxui-local.test.mjs scripts/muxui-source.test.mjs scripts/muxui-regenerator.test.mjs scripts/dev-profile-clean.test.mjs scripts/size-ratchet.test.mjs scripts/bento-build.test.mjs scripts/dev-reload.test.mjs scripts/theme-sheets.test.mjs scripts/check-firefox-compat.test.mjs scripts/mux-css.test.mjs scripts/legacy-aliases.test.mjs scripts/undefined-tokens.test.mjs scripts/overlay-manager.test.mjs scripts/overlay-surfaces.test.mjs scripts/mount-sheet-gate.test.mjs scripts/check-doc-links.test.mjs scripts/mount-icons.test.mjs scripts/mount-workspace-watchdog.test.mjs scripts/mount-window-handover.test.mjs scripts/mount-restored-pinned-unload.test.mjs scripts/import-output-checks.test.mjs scripts/check-motion-values.test.mjs scripts/mount-motion.test.mjs scripts/mount-fade-css.test.mjs scripts/mount-sidebar-push.test.mjs scripts/mount-sidebar-push-geometry.test.mjs scripts/mount-downloads-anchor.test.mjs scripts/mount-rail-tooltip.test.mjs scripts/shell-bus-actors.test.mjs scripts/marionette-client.test.mjs scripts/import-inputs.test.mjs scripts/macos-sign-release.test.mjs scripts/check-macos-signing.test.mjs scripts/ota-publish.test.mjs update-service/worker.test.mjs

      - name: Zen reference boundary
        run: pnpm run check:zen-boundary

      - name: Zen reference boundary tests
        run: pnpm run test:boundary-detector

      - name: Bento build driver reads our config
        # Proves bento.json loads, the Firefox version is well formed, and the
        # release channel in config/firefox-versions.json agrees with it. No
        # version literal, so Firefox upgrades do not need to edit this step.
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { loadConfig } from './scripts/bento-build.mjs';
            const c = loadConfig();
            const version = c.firefox.version;
            if (!/^[0-9]+(\.[0-9]+)+([A-Za-z][0-9A-Za-z.-]*|-[0-9A-Za-z.-]+)?\$/.test(version)) throw new Error('malformed Firefox version: ' + version);
            const versions = JSON.parse(fs.readFileSync('config/firefox-versions.json', 'utf8'));
            const release = versions.channels?.find((entry) => entry.channel === 'release');
            if (release?.version !== version) throw new Error('config/firefox-versions.json release version ' + release?.version + ' does not match bento.json ' + version);
            console.log('bento.json loaded for Firefox ' + version);
          "

      - name: Bento source license check
        # Last: it regenerates theme presets and chrome tokens in the worktree.
        run: pnpm run lc

  extensions-checks:
    name: Extensions — typecheck, lint, test
    # Runs beside extensions-build. The two Typecheck steps below are CI's only
    # type gate: ext:bundle deliberately skips tsc, so do not drop them.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Typecheck (shell)
        run: pnpm --filter @bento/shell typecheck

      - name: Typecheck (tools)
        run: pnpm --filter @bento/tools typecheck

      - name: Lint (shell)
        run: pnpm --filter @bento/shell lint

      - name: Lint (tools)
        run: pnpm --filter @bento/tools lint

      - name: Legacy token alias cap
        # Fails when a shell stylesheet, or the total, uses more legacy aliases
        # (--neutral-*, --color-*, --space-*, --radius-*, --shadow-*) than
        # .legacy-alias-cap.json allows. The cap only goes down.
        run: pnpm run lint:aliases

      - name: Undefined shell tokens and bento layer order
        # Fails when shell CSS reads var(--x) with no fallback and nothing in the
        # shell CSS or the public @muxui/react styles declares --x, or uses a
        # bento.* layer the root-level order statement in theme/muxui.css omits.
        # Layers are read with PostCSS, and a sheet or layer CSS it cannot read
        # also fails.
        run: pnpm run lint:tokens

      - name: Raw motion values
        # Fails when a stylesheet or inline style sets a transition or animation
        # from a raw time or easing instead of a --muxui-semantic-motion-* token.
        run: pnpm run lint:motion

      - name: Test (shell)
        run: pnpm --filter @bento/shell test

      - name: Test (tools)
        run: pnpm --filter @bento/tools test

  extensions-build:
    name: Extensions — bundle, release gate, size-limit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Bundle extensions
        # ext:bundle is ext:build without the tsc gate, which extensions-checks
        # already runs.
        env:
          BENTO_RELEASE: '1'
        run: pnpm run ext:bundle

      - name: Product identity in the built extensions
        # The import check scans the installed add-ons for forbidden product
        # identities. Extension source is the one import input a pull request may
        # skip source-import for, and source only reaches the engine through
        # dist, so the same scan runs on the bundles here.
        run: pnpm run check:product-identity:built

      - name: Release shell has no dev-only reload command
        # The release bundle must not ship the Alt+Shift+R handler
        # (scripts/dev-reload.mjs).
        run: pnpm run release:security-check:shell

      - name: Check size budgets
        # Fails when an entry grows past .size-baseline.json by more than
        # max(1%, 1 KB). Ceilings over the target are reported, not gated.
        # Missing or malformed built assets still fail.
        run: pnpm run size:check

  source-import:
    # The check name keeps the label it had when this job was a platform matrix
    # entry, so a required-status-check rule on it keeps matching.
    name: Source import (linux-x64)
    # Starts once the security gate and the change detector finish; it does not
    # wait for the static or extension checks, which run beside it (minutes are
    # free on this public repo, and the run is as long as its slowest job). A
    # pull request whose changed files cannot affect the import skips this job.
    # Every push to main runs it and seeds the engine source cache. The skip
    # fails open: a failed `changes` job or an empty answer runs it (the status
    # functions below replace the implicit success() check, which would skip
    # this job when `changes` fails). A failed security gate still stops it.
    needs: [security-gate, changes]
    if: ${{ !cancelled() && needs.security-gate.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.import != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Configure deterministic Firefox source checkout
        run: |
          git config --global user.name "Bento CI"
          git config --global user.email "ci@bentobrowser.invalid"
          git config --global core.autocrlf false
          git config --global core.longpaths true
          # tar keeps mtime and size but not ctime and inode, so by default the
          # first status after a cache restore re-verifies every restored file.
          # Keep this in global config for the whole job.
          git config --global core.checkStat minimal
          # No detached gc while the cache is saved.
          git config --global gc.auto 0
          git config --global maintenance.auto false

      # The bundle does not need the Firefox source, so it runs in the background
      # while the cache restores. setsid lets it outlive this step; the Wait step
      # below collects its status and log before the import needs the output.
      - name: Start extension bundle
        env:
          BENTO_RELEASE: '1'
        run: |
          # shellcheck disable=SC2016 # $? and $RUNNER_TEMP expand in the child shell.
          setsid nohup bash -c 'pnpm run ext:bundle; echo $? > "$RUNNER_TEMP/ext-bundle.status"' \
            > "$RUNNER_TEMP/ext-bundle.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/ext-bundle.pid"

      # Pristine source keyed by Firefox version and source digest. Bento's
      # source command checks the protected engine checkout before it is used.
      - name: Firefox source (engine/)
        id: engine-source
        uses: ./.github/actions/engine-source

      - name: Wait for extension bundle
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/ext-bundle.status"
          pid="$(cat "$RUNNER_TEMP/ext-bundle.pid")"
          # At most about five minutes; the bundle takes well under one.
          for _ in $(seq 600); do
            [ -s "$status_file" ] && break
            if ! kill -0 "$pid" 2> /dev/null; then
              # The wrapper writes the status just before it exits.
              [ -s "$status_file" ] || echo 'The extension bundle process exited without a status.'
              break
            fi
            sleep 0.5
          done
          echo '--- ext:bundle log ---'
          cat "$RUNNER_TEMP/ext-bundle.log"
          echo '--- end of ext:bundle log ---'
          if [ ! -s "$status_file" ]; then
            echo 'The extension bundle did not finish.' >&2
            exit 1
          fi
          status="$(cat "$status_file")"
          [[ "$status" =~ ^[0-9]+$ ]] || status=1
          exit "$status"

      - name: Import Bento sources
        env:
          BENTO_RELEASE: '1'
        run: pnpm run import

      - name: Verify repeated import is idempotent
        env:
          BENTO_RELEASE: '1'
        run: |
          node scripts/snapshot-import-output.mjs > import-first.sha256
          pnpm run import
          node scripts/snapshot-import-output.mjs > import-second.sha256
          node -e "const fs=require('fs'); if(fs.readFileSync('import-first.sha256','utf8')!==fs.readFileSync('import-second.sha256','utf8')) process.exit(1)"

      - name: Verify imported branding, add-ons, patches, and identity
        run: node scripts/check-import-output.mjs

      - name: Imported release shell has no dev-only reload command
        # Covers the manifest the installer copies into the engine as well.
        run: pnpm run release:security-check:shell

      - name: Cache summary
        if: always()
        shell: bash
        env:
          SOURCE_HIT: ${{ steps.engine-source.outputs.cache-hit }}
        run: |
          {
            echo '### Source cache'
            echo
            echo "- Firefox source: $([ "$SOURCE_HIT" = true ] && echo hit || echo miss)"
          } >> "$GITHUB_STEP_SUMMARY"
