<html data-bento-theme="default" data-color-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; object-src 'none'; script-src chrome:; img-src chrome:; style-src chrome:;"
    />
    <title>Bento browser data import</title>
    <script src="chrome://global/content/customElements.js"></script>
    <script src="chrome://browser/content/bento-migration-host.js"></script>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="chrome://browser/content/bento-chrome-tokens.css" />
    <link rel="stylesheet" href="chrome://browser/content/bento-migration-host.css" />
    <script
      src="chrome://browser/content/migration/migration-wizard-constants.mjs"
      type="module"
    ></script>
    <script src="chrome://browser/content/migration/migration-wizard.mjs" type="module"></script>
  </head>
  <body>
    <main
      class="bento-migration-host bento-dialog__popup bento-card bento-card--outlined bento-card--md"
    >
      <header class="bento-migration-host__header">
        <span class="bento-migration-host__mark" aria-hidden="true"></span>
        <span class="bento-migration-host__label bento-card__header">Bento import</span>
      </header>
      <section class="bento-migration-host__startup bento-card bento-card--filled bento-card--sm">
        <div class="bento-migration-host__startup-copy bento-card__body">
          <strong class="bento-card__header">Firefox and Zen profiles</strong>
          <span class="bento-card__body">Full profile imports run before Bento starts.</span>
        </div>
        <button
          id="restart-profile-import"
          class="bento-button bento-button--primary bento-button--md"
          type="button"
        >
          Import Firefox or Zen
        </button>
      </section>
      <migration-wizard
        id="wizard"
        dialog-mode
        selection-header-string="Import browser data"
        selection-subheader-string="Choose a browser profile and the data Bento should copy."
        import-button-string="Import"
        header-font-weight="650"
      ></migration-wizard>
    </main>
  </body>
</html>
