<!doctype html>
<html lang="en" class="tale-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Workspace Palette</title>

    <script src="./boot.js"></script>

    <!-- Transparent background. The chrome <browser> frame covers the
         window; the CommandPalette backdrop draws the modal scrim. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent !important;
        background-color: transparent !important;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/workspace-palette/main.tsx"></script>
  </body>
</html>
