<!doctype html>
<html lang="en" class="tale-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Panel Trailer</title>

    <!-- Persist color-mode preference; same boot script as the main shell. -->
    <script src="./boot.js"></script>

    <!-- Background is intentionally transparent. The chrome XUL <vbox> host
         carries any hover/focus styling for the trailer outer; this iframe
         only paints its button row on top. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel-trailer/main.tsx"></script>
  </body>
</html>
