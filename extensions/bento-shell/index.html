<!doctype html>
<html lang="en" class="tale-ui" data-color-mode="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Shell</title>

    <!-- Persist color-mode preference across reloads (Tale UI consumer
         requirement, see CLAUDE.md § "UI Components" step 7). External
         file because extension page CSP blocks inline <script>. -->
    <script src="./boot.js"></script>

    <!-- Critical CSS skeleton (§6.3) — keeps cold start under 80ms by drawing
         the empty shell shape before React hydrates. Replace with the real
         vertical-tab-strip skeleton in M1. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100%;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
