<!doctype html>
<html lang="en" class="tale-ui" data-color-mode="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Shell</title>

    <!-- Persist color-mode preference across reloads (Tale UI consumer requirement). -->
    <script>
      (function () {
        try {
          var mode =
            localStorage.getItem('color-mode') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-color-mode', mode);
          document.documentElement.setAttribute('data-theme', mode);
        } catch (_) {
          /* localStorage may not be available in all chrome contexts */
        }
      })();
    </script>

    <!-- Critical CSS skeleton (§6.3) — keeps cold start under 80ms by drawing
         the empty shell shape before React hydrates. Replace with the real
         vertical-tab-strip skeleton in M1. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100%;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
