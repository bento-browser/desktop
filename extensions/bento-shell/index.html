<!doctype html>
<html lang="en" class="tale-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Shell</title>

    <!-- Persist color-mode preference across reloads (Tale UI consumer
         requirement, see CLAUDE.md § "UI Components" step 7). External
         file because extension page CSP blocks inline <script>. -->
    <script src="./boot.js"></script>

    <!-- Critical CSS (§6.3) — paints the sidebar's brand-shaped shell before
         any external CSS or JS loads. Hardcoded values match the Bento brand
         (#282a33 mirrors --bento-brand-bg, kept in sync manually). The
         skeleton DOM below uses these classes so first paint shows the
         right silhouette; React hides #bento-skeleton on first commit. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root,
      #bento-skeleton {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #bento-skeleton {
        position: absolute;
        inset: 0;
        background-color: light-dark(#f7f8fa, #282a33);
        display: flex;
        flex-direction: column;
      }
      #bento-skeleton[hidden] {
        display: none;
      }
      .bento-skeleton__header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        height: 2rem;
        box-sizing: border-box;
      }
      .bento-skeleton__avatar {
        width: 1rem;
        height: 1rem;
        border-radius: 0.25rem;
        background-color: light-dark(rgba(0, 0, 0, 0.06), rgba(255, 255, 255, 0.08));
        flex-shrink: 0;
      }
      .bento-skeleton__bar {
        height: 0.5625rem;
        border-radius: 0.1875rem;
        background-color: light-dark(rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.06));
      }
      .bento-skeleton__bar--label {
        width: 3.75rem;
      }
      .bento-skeleton__rows {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        padding: 0.5rem;
      }
      .bento-skeleton__row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        height: 1.25rem;
      }
      .bento-skeleton__row .bento-skeleton__avatar {
        width: 0.625rem;
        height: 0.625rem;
      }
      .bento-skeleton__row .bento-skeleton__bar {
        flex: 1;
        max-width: 10rem;
      }
    </style>
  </head>
  <body>
    <!-- Static skeleton — visible from first paint until React's first
         commit hides it. Decorative only (sits beside #root, not inside).
         Removing it via React effect rather than DOM mutation avoids
         layout thrashing during the hydration commit. -->
    <div id="bento-skeleton" aria-hidden="true">
      <div class="bento-skeleton__header">
        <div class="bento-skeleton__avatar"></div>
        <div class="bento-skeleton__bar bento-skeleton__bar--label"></div>
      </div>
      <div class="bento-skeleton__rows">
        <div class="bento-skeleton__row">
          <div class="bento-skeleton__avatar"></div>
          <div class="bento-skeleton__bar"></div>
        </div>
        <div class="bento-skeleton__row">
          <div class="bento-skeleton__avatar"></div>
          <div class="bento-skeleton__bar"></div>
        </div>
        <div class="bento-skeleton__row">
          <div class="bento-skeleton__avatar"></div>
          <div class="bento-skeleton__bar"></div>
        </div>
        <div class="bento-skeleton__row">
          <div class="bento-skeleton__avatar"></div>
          <div class="bento-skeleton__bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
