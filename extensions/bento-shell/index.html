<!doctype html>
<html lang="en" class="tale-ui" data-color-mode="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Shell</title>

    <!-- Persist color-mode preference across reloads (Tale UI consumer
         requirement, see CLAUDE.md § "UI Components" step 7). External
         file because extension page CSP blocks inline <script>. -->
    <script src="./boot.js"></script>

    <!-- Critical CSS skeleton (§6.3) — keeps cold start under 80ms by drawing
         the empty shell shape before React hydrates. Real layout takes over
         once @bento-shell-app/app.css loads. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
