<!doctype html>
<html lang="en" class="tale-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Privacy</title>

    <!-- about:bento-privacy routing fix. The about: handler keeps the URL bar
         showing about:bento-privacy (cross-profile-portable bookmark target)
         but Firefox uses that as the document base URL, which breaks every
         relative <script src="./..."> below — `./boot.js` becomes
         `about:bento-privacy/./boot.js` and the parser refuses it.
         The actual content loads from moz-extension origin (channel.URI is
         the extension URL), so `browser.runtime.getURL` IS available here.
         Inject a <base> pointing at the extension's dist/ before the
         relative-src tags get parsed — the browser re-resolves subsequent
         tags against the new base. Inline + synchronous, runs before the
         next <script> below it. -->
    <script>
      (function () {
        try {
          if (
            location.href.startsWith('about:bento-') &&
            typeof browser !== 'undefined' &&
            browser.runtime &&
            typeof browser.runtime.getURL === 'function'
          ) {
            var base = document.createElement('base');
            base.href = browser.runtime.getURL('dist/');
            document.head.appendChild(base);
          }
        } catch (e) {
          /* worst case: relative paths fail and the user sees a blank page;
             they can still reach privacy via the sidebar Settings button. */
        }
      })();
    </script>

    <!-- Persist color-mode preference; same boot script as the main shell. -->
    <script src="./boot.js"></script>

    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: light-dark(#f7f8fa, #282a33);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacy/main.tsx"></script>
  </body>
</html>
