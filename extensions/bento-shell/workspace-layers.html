<!doctype html>
<html lang="en" data-bento-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Workspace Layers</title>

    <script src="./boot.js"></script>

    <!-- Transparent background: the chrome <browser> hosting this page covers
         the whole browser window, so the switcher menu can render outside the
         sidebar and the dialogs draw their own backdrop. Chrome keeps the host
         from taking the pointer while no layer is shown. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent !important;
        background-color: transparent !important;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/workspace-layers/main.tsx"></script>
  </body>
</html>
